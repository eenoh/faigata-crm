      <stop offset="0%" stop-color="#6366f1"></stop>
      <stop offset="100%" stop-color="#4f46e5"></stop>
    </radialGradient>
  </defs>

  <!-- Moon Base -->
  <circle cx="24" cy="24" r="20" fill="url(#moonGradient)"></circle>

  <!-- Craters -->
  <circle cx="18" cy="18" r="4" fill="#4338ca" opacity="0.5"></circle>
  <circle cx="30" cy="16" r="3" fill="#4338ca" opacity="0.45"></circle>
  <circle cx="28" cy="28" r="5" fill="#4338ca" opacity="0.4"></circle>
  <circle cx="16" cy="30" r="3" fill="#4338ca" opacity="0.5"></circle>
  <circle cx="22" cy="25" r="2" fill="#4338ca" opacity="0.6"></circle>

  <!-- Soft highlight -->
