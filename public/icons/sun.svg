<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <!-- Core glow gradient (brand-indigo, but "sunny") -->
    <radialGradient id="sunCore" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#818cf8"></stop>
      <stop offset="55%" stop-color="#6366f1"></stop>
      <stop offset="100%" stop-color="#4f46e5"></stop>
    </radialGradient>

    <!-- Outer aura -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Soft blur glow -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura / halo -->
  <circle cx="24" cy="24" r="20" fill="url(#sunAura)"></circle>

  <!-- Rays (recognizable sun silhouette) -->
  <g stroke="#4f46e5" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="24" y1="4.5" x2="24" y2="10"></line>
    <line x1="24" y1="38" x2="24" y2="43.5"></line>
    <line x1="4.5" y1="24" x2="10" y2="24"></line>
    <line x1="38" y1="24" x2="43.5" y2="24"></line>

    <line x1="10.2" y1="10.2" x2="14.2" y2="14.2"></line>
    <line x1="33.8" y1="33.8" x2="37.8" y2="37.8"></line>
    <line x1="10.2" y1="37.8" x2="14.2" y2="33.8"></line>
    <line x1="33.8" y1="14.2" x2="37.8" y2="10.2"></line>
  </g>

  <!-- Sun body -->
  <g filter="url(#softGlow)">
    <circle cx="24" cy="24" r="11.5" fill="url(#sunCore)"></circle>

    <!-- Texture spots (like solar surface) -->
    <circle cx="20" cy="20" r="3.2" fill="#4338ca" opacity="0.28"></circle>
    <circle cx="30" cy="19" r="2.4" fill="#4338ca" opacity="0.22"></circle>
    <circle cx="29" cy="28" r="3.8" fill="#4338ca" opacity="0.20"></circle>
    <circle cx="19" cy="29" r="2.2" fill="#4338ca" opacity="0.26"></circle>

    <!-- Hot highlight -->
    <circle cx="20" cy="18.5" r="7.2" fill="#ffffff" opacity="0.08"></circle>
  </g>
</svg>